services:
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service-app
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      RANDOM_SERVICE_URL: ${RANDOM_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "8084:8080"