name: Payment Service CI Pipeline

on:
  push:
    branches:
      - "feature/PMNT-0"
  pull_request:
    branches:
      - "main"

jobs:
  build-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests (Unit + Testcontainers)
        run: mvn -B clean verify

      - name: Build Docker image
        run: docker build -t payment-service:latest .

      - name: Save Docker image as artifact
        run: docker save payment-service:latest -o payment-service.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-image
          path: payment-service.tar